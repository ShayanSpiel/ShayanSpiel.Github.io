lass="deck-slide" aria-label="The thesis, slide 1 / 61"><header class="deck-heading"><h1>How can a company <em>use AI?</em></h1><p>Start with the business objective, then understand how work gets done.</p></header></main></div><div class="deck-rotate"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"></path><path d="M4.9 9a7.5 7.5 0 0 1 12.4-2.8L20 9M4 17v-5h5"></path><path d="M19.1 15a7.5 7.5 0 0 1-12.4 2.8L4 15"></path></svg></span><p>Turn your screen.</p><small>This presentation is composed for landscape.</small></div><nav class="deck-progress" aria-label="Presentation navigation"><div class="deck-chapter-dots"><button aria-label="Chapter 0: The thesis" title="The thesis" aria-current="step" class=""></button><button aria-label="Chapter 1: Management" title="Management" class=""></button><button aria-label="Chapter 2: Transformation team" title="Transformation team" class=""></button><button aria-label="Chapter 3: Company architecture" title="Company architecture" class=""></button><button aria-label="Chapter 4: Inside the harness" title="Inside the harness" class=""></button><button aria-label="Chapter 5: Memory &amp; learning" title="Memory &amp; learning" class=""></button><button aria-label="Chapter 6: Process to workflow" title="Process to workflow" class=""></button><button aria-label="Chapter 7: Scale to departments" title="Scale to departments" class=""></button><button aria-label="Chapter 8: Observability &amp; evals" title="Observability &amp; evals" class=""></button><button aria-label="Chapter 9: The AI-first organization" title="The AI-first organization" class=""></button></div><span class="deck-progress-divider"></span><div class="deck-slide-dots"><button aria-label="Slide 1: How can a company use AI?" title="How can a company use AI?" aria-current="step" class=" "></button><button aria-label="Slide 2: Start with the business objective." title="Start with the business objective." class=" "></button><button aria-label="Slide 3: Ask how work gets done." title="Ask how work gets done." class=" "></button><button aria-label="Slide 4: Choose one valuable workflow." title="Choose one valuable workflow." class=" "></button></div><small>01<!-- --> / <!-- -->61</small></nav><span class="deck-announcement" aria-live="polite" aria-atomic="true">The thesis<!-- -->. Slide <!-- -->1<!-- --> of <!-- -->61<!-- -->. <!-- -->How can a company use AI?</span><noscript><div class="deck-transcript"><section><h2>How can a company use AI?</h2><p>Start with the business objective, then understand how work gets done.</p></section><section><h2>Start with the business objective.</h2><p>Use AI to create more value: increase capacity, improve quality and lower the cost of getting work done.</p></section><section><h2>Ask how work gets done.</h2><p>Tasks are individual actions. Workflows connect them. Systems make the whole way of working repeatable.</p></section><section><h2>Choose one valuable workflow.</h2><p>Start with a recurring business problem, redesign the work and prove the result before expanding.</p></section><section><h2>The management framework.</h2><p>Goal → Observe → Decide → Act → Evaluate.</p></section><section><h2>Goal. Set the target.</h2><p>2× output at half the operating cost, one workflow at a time.</p></section><section><h2>Observe. Follow the real work.</h2><p>Gather facts, traces and feedback to see where time, money and quality are lost.</p></section><section><h2>Decide. Choose the next change.</h2><p>Use the evidence to prioritize an improvement and record the tradeoffs.</p></section><section><h2>Act. Put the change to work.</h2><p>Execute through the harness, workflows and tools, with people owning consequential decisions.</p></section><section><h2>Evaluate. Did it work?</h2><p>Compare results with the goal, keep the lessons and feed the next cycle.</p></section><section><h2>The management framework.</h2><p>Goal → Observe → Decide → Act → Evaluate sits above the harness that executes the work.</p></section><section><h2>The transformation team.</h2><p>The people who design, build and improve the company’s AI systems.</p></section><section><h2>There is a manager for the transformation.</h2><p>Business analysis, agent engineering and observability connect priorities, system design and measurable outcomes.</p></section><section><h2>Understand before automating.</h2><p>Process analysts uncover how the work really happens and where a better design will matter.</p></section><section><h2>Design for the whole system.</h2><p>Architecture makes context, models and tools work together toward a business result.</p></section><section><h2>Turn a better idea into daily work.</h2><p>Engineers build the agents, workflows and integrations that people can depend on.</p></section><section><h2>Build Observability and Evals in.</h2><p>The Evals engineer connects run traces, quality checks and business results from the start.</p></section><section><h2>One transformation team. Every department.</h2><p>Business teams own their outcomes. The transformation team helps them continuously improve.</p></section><section><h2>karwise. The company OS.</h2><p>Your company context, harness, memory and tools in one operating system.</p></section><section><h2>Your business is the context.</h2><p>AI needs your strategy, policies, knowledge, people and systems to make useful decisions.</p></section><section><h2>karwise is the shared operating system.</h2><p>The product brings context, memory, the harness, tools, guardrails and observability into one workspace.</p></section><section><h2>Same foundation. Different work.</h2><p>Each department gets workflows, agents and measures designed for its own outcomes.</p></section><section><h2>Keep the tools that work.</h2><p>Connect your preferred models and platforms as execution providers inside one coherent system.</p></section><section><h2>Company context. karwise. Department systems.</h2><p>One AI operating system connects your knowledge, harness and execution providers to business outcomes.</p></section><section><h2>The OS becomes a product surface.</h2><p>Context, execution and evidence meet in one inspectable workspace.</p></section><section><h2>Inside the AI harness.</h2><p>Follow one prompt through context, the runtime, tools and guardrails.</p></section><section><h2>Every run starts with a prompt.</h2><p>A prompt, task, trigger or event gives the harness a clear piece of work.</p></section><section><h2>Brief the system before it acts.</h2><p>Load the relevant request, knowledge, tools and boundaries for this task.</p></section><section><h2>The harness runs the agent loop.</h2><p>The runtime reasons, calls tools and observes results until the task meets its completion criteria.</p></section><section><h2>Give specialists the right work.</h2><p>Delegate research, building, analysis and review when a dedicated worker can improve the result.</p></section><section><h2>Completion has a quality bar.</h2><p>Check correctness, policy and required work before accepting the result.</p></section><section><h2>Every action leaves evidence.</h2><p>Keep a trace of context, model calls, tools, timing, costs, errors and produced artifacts.</p></section><section><h2>The harness turns prompts into verified work.</h2><p>Context, runtime, tools, workers and guardrails form one observable execution loop.</p></section><section><h2>A company that remembers.</h2><p>Keep the knowledge, methods and lessons that make the next run better.</p></section><section><h2>Procedural memory knows how.</h2><p>Procedural memory stores proven methods so the next run can reuse them.</p></section><section><h2>Semantic memory knows what.</h2><p>Semantic memory keeps useful facts and knowledge available with their sources.</p></section><section><h2>Episodic memory remembers what happened.</h2><p>Episodic memory captures past situations, decisions and
