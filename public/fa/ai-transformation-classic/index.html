نجام می‌شود." title="بپرسید کار چگونه انجام می‌شود." class=" "></button><button aria-label="اسلاید 4: یک گردش‌کار ارزشمند انتخاب کنید." title="یک گردش‌کار ارزشمند انتخاب کنید." class=" "></button></div><small>01<!-- --> / <!-- -->61</small></nav><span class="deck-announcement" aria-live="polite" aria-atomic="true">ایدهٔ اصلی<!-- -->. اسلاید <!-- -->1<!-- --> از <!-- -->61<!-- -->. <!-- -->یک شرکت چطور می‌تواند از هوش مصنوعی استفاده کند؟</span><noscript><div class="deck-transcript"><section><h2>یک شرکت چطور می‌تواند از هوش مصنوعی استفاده کند؟</h2><p>از هدف کسب‌وکار شروع کنید؛ سپس ببینید کار چگونه انجام می‌شود.</p></section><section><h2>از هدف کسب‌وکار شروع کنید.</h2><p>هوش مصنوعی باید ارزش بیشتری بسازد: ظرفیت بالاتر، کیفیت بهتر و هزینهٔ کمتر برای انجام کار.</p></section><section><h2>بپرسید کار چگونه انجام می‌شود.</h2><p>وظیفه یک اقدام مشخص است؛ گردش‌کار وظیفه‌ها را متصل می‌کند؛ سیستم این روش کار را تکرارپذیر می‌سازد.</p></section><section><h2>یک گردش‌کار ارزشمند انتخاب کنید.</h2><p>از یک مسئلهٔ تکرارشونده شروع کنید، کار را بازطراحی کنید و پیش از گسترش، نتیجه را اثبات کنید.</p></section><section><h2>چارچوب مدیریت.</h2><p>هدف ← مشاهده ← تصمیم ← اقدام ← ارزیابی.</p></section><section><h2>هدف؛ مقصد را مشخص کنید.</h2><p>هدف: دو برابر خروجی با نصف هزینهٔ عملیاتی؛ هر بار یک گردش‌کار.</p></section><section><h2>مشاهده؛ کار واقعی را دنبال کنید.</h2><p>واقعیت‌ها، ردّ اجراها و بازخوردها را جمع کنید تا اتلاف زمان، هزینه و کیفیت آشکار شود.</p></section><section><h2>تصمیم؛ تغییر بعدی را انتخاب کنید.</h2><p>با تکیه بر شواهد، بهبود بعدی را اولویت‌بندی و ملاحظات تصمیم را ثبت کنید.</p></section><section><h2>اقدام؛ تغییر را اجرا کنید.</h2><p>اجرا را به هارنس، گردش‌کارها و ابزارها بسپارید؛ مسئولیت تصمیم‌های مهم با انسان بماند.</p></section><section><h2>ارزیابی؛ آیا نتیجه داد؟</h2><p>نتیجه را با هدف مقایسه کنید و آموخته‌ها را وارد چرخهٔ بعدی کنید.</p></section><section><h2>چارچوب مدیریت.</h2><p>هدف ← مشاهده ← تصمیم ← اقدام ← ارزیابی؛ چارچوبی برای هدایت هارنسِ اجرای کار.</p></section><section><h2>تیم تحول.</h2><p>افرادی که سیستم‌های هوش مصنوعی شرکت را طراحی می‌کنند، می‌سازند و بهبود می‌دهند.</p></section><section><h2>تحول به یک مدیر نیاز دارد.</h2><p>تحلیل کسب‌وکار، مهندسی ایجنت و مشاهده‌پذیری، اولویت‌ها را به طراحی سیستم و نتایج قابل‌اندازه‌گیری متصل می‌کنند.</p></section><section><h2>پیش از خودکارسازی، درک کنید.</h2><p>تحلیلگران فرایند، شیوهٔ واقعی انجام کار و فرصت‌های مؤثر برای بازطراحی را پیدا می‌کنند.</p></section><section><h2>برای کل سیستم طراحی کنید.</h2><p>معماری، زمینه، مدل‌ها و ابزارها را برای رسیدن به یک نتیجهٔ کسب‌وکار هماهنگ می‌کند.</p></section><section><h2>ایدهٔ بهتر را به کار روزمره تبدیل کنید.</h2><p>مهندسان، ایجنت‌ها، گردش‌کارها و اتصال‌هایی می‌سازند که افراد بتوانند به آن‌ها تکیه کنند.</p></section><section><h2>مشاهده‌پذیری و ارزیابی را از ابتدا بسازید.</h2><p>مهندس ارزیابی از ابتدا ردّ اجرا، بررسی کیفیت و نتیجهٔ کسب‌وکار را به هم متصل می‌کند.</p></section><section><h2>یک تیم تحول. برای تمام واحدها.</h2><p>هر واحد مسئول نتایج خود است؛ تیم تحول به بهبود مستمر آن کمک می‌کند.</p></section><section><h2>کاروایز؛ سیستم‌عامل شرکت.</h2><p>زمینهٔ شرکت، هارنس، حافظه و ابزارها در یک سیستم‌عامل مشترک.</p></section><section><h2>کسب‌وکار شما، زمینهٔ کار است.</h2><p>هوش مصنوعی برای تصمیم مفید به راهبرد، سیاست‌ها، دانش، افراد و سیستم‌های شما نیاز دارد.</p></section><section><h2>کاروایز سیستم‌عامل مشترک شرکت است.</h2><p>این محصول، زمینه، حافظه، هارنس، ابزارها، کنترل‌ها و مشاهده‌پذیری را در یک محیط کاری جمع می‌کند.</p></section><section><h2>زیرساخت مشترک. کارهای متفاوت.</h2><p>هر واحد، گردش‌کارها، ایجنت‌ها و سنجه‌های متناسب با نتایج خود را دارد.</p></section><section><h2>ابزارهای کارآمد را نگه دارید.</h2><p>مدل‌ها و پلتفرم‌های منتخب را به‌عنوان ارائه‌دهندهٔ اجرا به یک سیستم هماهنگ متصل کنید.</p></section><section><h2>زمینهٔ شرکت. کاروایز. سیستم‌های واحدها.</h2><p>یک سیستم‌عامل هوش مصنوعی، دانش، هارنس و ابزارهای اجرا را به نتایج کسب‌وکار متصل می‌کند.</p></section><section><h2>سیستم‌عامل به یک محصول ملموس تبدیل می‌شود.</h2><p>زمینه، اجرا و شواهد در یک محیط کاری قابل‌بررسی کنار هم قرار می‌گیرند.</p></section><section><h2>درون هارنس هوش مصنوعی.</h2><p>مسیر یک پرامپت را از زمینه تا اجرا، ابزارها و کنترل‌های ایمنی دنبال کنید.</p></section><section><h2>هر اجرا با یک پرامپت شروع می‌شود.</h2><p>پرامپت، وظیفه، محرک یا رویداد، کار مشخصی را به هارنس می‌سپارد.</p></section><section><h2>پیش از اقدام، سیستم را توجیه کنید.</h2><p>درخواست، دانش، ابزارها و محدودیت‌های مرتبط با همین وظیفه را بارگذاری کنید.</p></section><section><h2>هارنس، چرخهٔ ایجنت را اجرا می‌کند.</h2><p>محیط اجرا استدلال می‌کند، ابزار فراخوانی می‌کند و نتیجه را می‌بیند تا معیارهای تکمیل کار محقق شوند.</p></section><section><h2>کار مناسب را به متخصص بسپارید.</h2><p>هر جا تخصص نتیجه را بهتر می‌کند، پژوهش، ساخت، تحلیل یا بازبینی را به عامل متخصص بسپارید.</p></section><section><h2>تکمیل کار، معیار کیفیت دارد.</h2><p>پیش از پذیرش نتیجه، درستی، رعایت سیاست‌ها و کامل بودن کار را بررسی کنید.</p></section><section><h2>هر اقدام، شواهدی به جا می‌گذارد.</h2><p>ردّ زمینه، فراخوانی مدل، ابزارها، زمان، هزینه، خطاها و خروجی‌های تولیدشده را نگه دارید.</p></section><section><h2>هارنس، پرامپت را به کار تأییدشده تبدیل می‌کند.</h2><p>زمینه، محیط اجرا، ابزارها، عامل‌ها و کنترل‌ها یک چرخهٔ اجرای قابل‌مشاهده می‌سازند.</p></section><section><h2>شرکتی که به یاد می‌سپارد.</h2><p>دانش، روش‌ها و آموخته‌هایی را نگه دارید که اجرای بعدی را بهتر می‌کنند.</p></section><section><h2>حافظهٔ رویه‌ای می‌داند چگونه.</h2><p>حافظهٔ رویه‌ای روش‌های آزموده را نگه می‌دارد تا اجرای بعدی از آن‌ها استفاده کند.</p></section><section><h2>حافظهٔ معنایی می‌داند چه چیزی.</h2><p>حافظهٔ معنایی، واقعیت‌ها و دانش مفید را همراه با منبع در دسترس نگه می‌دارد.</p></section><section><h2>حافظهٔ رویدادی به یاد دارد چه اتفاقی افتاد.</h2><p>حافظهٔ رویدادی، موقعیت‌ها، تصمیم‌ها و نتایج گذشته را که ارزش یادگیری دارند ثبت می‌کند.</p></section><section><h2>دانش مناسب را به این وظیفه برسانید.</h2><p>اطلاعات مرتبط را بازیابی کنید، موارد اضافی را کنار بگذارید و زمینه‌ای متمرکز بسازید.</p></section><section><h2>تجربه را به مزیت تبدیل کنید.</h2><p>ردّ اجراهای مفید را مرور کنید، آموخته‌ها را نگه دارید و دانش یا روش‌های آینده را به‌روز کنید.</p></section><section><h2>اجرای بعدی با آگاهی بیشتر شروع می‌شود.</h2><p>روش‌ها، واقعیت‌ها و تجربه، ورودی کار هستند؛ نتیجه نیز آموخته‌ای تازه اضافه می‌کند.</p></section><section><h2>بازطراحیِ کار.</h2><p>از فرایند کسب‌وکار شروع کنید؛ فناوری را بعد از آن انتخاب کنید.</p></section><section><h2>گردش‌کار، نتیجهٔ کسب‌وکار می‌سازد.</h2><p>پیش از انتخاب فناوری، ورودی، تصمیم‌ها، اقدام‌ها و نتیجه را مشخص کنید.</p></section><section><h2>کاری را ترسیم کنید که واقعاً انجام می‌شود.</h2><p>افراد، اطلاعات، تصمیم‌ها و محدودیت‌های فرایند فعلی را شناسایی کنید.</p></section><section><h2>فرایند بدِ سریع‌تر، همچنان بد است.</h2><p>پیش از خودکارسازی، اتلاف را حذف کنید، تصمیم‌ها را روشن کنید و جایگاه قضاوت انسانی را حفظ کنید.</p></section><section><h2>روش مناسب اجرا را انتخاب کنید.</h2><p>مهارت‌ها، ایجنت‌ها، کد، ابزار گردش‌کار، اتصال MCP، API یا انسان را در جای مناسب به کار بگیرید.</p></section><section><h2>پیش از جایگزینی، کارایی را اثبات کنید.</h2><p>گردش‌کار جدید را کنار فرایند فعلی اجرا کنید و کیفیت را روی کارهای قابل‌مقایسه بسنجید.</p></section><section><h2>از تحویل دستی کار تا نتایج قابل‌سنجش.</h2><p>درخواست پشتیبانی به گردش‌کاری متصل، همراه با کنترل، ارجاع و بازخورد تبدیل می‌شود.</p></section><section><h2>اثبات کنید؛ سپس گسترش دهید.</h2><p>موفقیت‌های تک‌موردی را به قابلیتی تبدیل کنید که تمام شرکت از آن استفاده کند.</p></section><section><h2>یک موفقیت، به توانمندی تیم تبدیل می‌شود.</h2><p>گردش‌کارهای آزموده را ترکیب کنید تا روش انجام یک دسته از کارهای واحد تغییر کند.</p></section><section><h2>زیرساخت مشترک؛ کار متناسب با هر واحد.</h2><p>واحدها زیرساخت مشترک دارند، اما زمینه، گردش‌کارها و معیارهای موفقیت خود را حفظ می‌کنند.</p></section><section><h2>چیزی را گسترش دهید که اثبات شده است.</h2><p>روش موفق را گام‌به‌گام و با سنجش نتیجه، به گردش‌کارها و واحدهای جدید گسترش دهید.</p></section><section><h2>تیم‌های تخصصی. هوشمندی مشترک.</h2><p>هر واحد روی یک زیرساخت سراسری، به سمت نتایج خ
