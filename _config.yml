title: Shayan Spiel
tagline: Agent Solution Architect — Define, validate, and refactor agentic systems.
description: >-
  I help startups define, validate, and refactor AI-agent workflows,
  harnesses, and eval systems before implementation becomes expensive or
  impossible to debug. Agent architecture, harness audits, and eval design.
keywords: Shayan Spiel, Shayan Tawabi, Agent Solution Architect, AI agent architecture, agentic workflow design, agent harness audit, agent evals, AI agent validation, context engineering, tool integration, agent system refactoring, LangGraph, agent orchestration

url: https://spielos.xyz
baseurl: ""
lang: en
locale: en_US
logo: /assets/logos/personal/primary-transparent.svg
favicon: /assets/favicons/favicon.svg
permalink: /:title/
paginate_path: /page/:num/

# Author, jekyll-seo-tag reads author.name and author.twitter
author:
  name: Shayan Spiel
  email: 66shayan@gmail.com
  twitter: ShayanSpiel

twitter:
  username: ShayanSpiel
  card: summary_large_image

social:
  name: Shayan Spiel (Shayan Tawabi)
  links:
    - https://twitter.com/ShayanSpiel
    - https://www.linkedin.com/in/shayantawabi
    - https://github.com/ShayanSpiel

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Per-page SEO defaults (consumed by jekyll-seo-tag)
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-default.png?v=2
        width: 1200
        height: 630
      seo:
        type: "WebSite"
  - scope:
      type: posts
    values:
      image:
        path: /assets/og-default.png?v=2
        width: 1200
        height: 630
      seo:
        type: "BlogPosting"

# Allow future-dated posts
future: true

# Don't let Jekyll exclude files/dirs starting with a dot
include:
  - .well-known

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/css/main.css.map
  - assets/logos/preview.html
  - infra/
  - _tools
  - _tools/DESIGN-SYSTEM-PLAN.md
  - scripts
  - design-system/components.json
  - _drafts
  - _tools/preview
  - preview-deepseek-v4.html
  - preview-deepseek-v4-official-launch.html
