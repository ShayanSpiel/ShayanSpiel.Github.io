<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Outfit';
  src: url('file:///Users/shayan/ShayanSpiel.Github.io/src/assets/fonts/outfit-latin.woff2') format('woff2');
  font-weight: 100 900;
  font-display: swap;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  font-family: 'Outfit', sans-serif;
  background: #1d2021;
  color: #fbf1c7;
  overflow: hidden;
  position: relative;
}
.bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(251,241,199,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(251,241,199,0.03) 1px, transparent 1px);
  background-size: 32px 32px;
}
.bg-glow {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  top: -200px;
  right: -100px;
}
.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
  padding: 64px 80px;
}
.top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 32px;
}
.logo-icon {
  width: 36px;
  height: 36px;
}
.brand {
  font-size: 16px;
  font-weight: 600;
  color: #a89984;
  letter-spacing: 0.5px;
}
.tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
  margin-left: 8px;
}
.title {
  font-size: 56px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1.5px;
  max-width: 900px;
  margin-bottom: 24px;
}
.desc {
  font-size: 20px;
  font-weight: 400;
  color: #a89984;
  max-width: 700px;
  line-height: 1.5;
}
.bottom-bar {
  position: absolute;
  bottom: 48px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.url {
  font-size: 15px;
  font-weight: 500;
  color: #665c54;
}
.handle {
  font-size: 15px;
  font-weight: 500;
  color: #665c54;
}
.accent-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
}
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow" id="glow"></div>
  <div class="accent-bar" id="accentBar"></div>
  <div class="container">
    <div class="top-bar">
      <svg class="logo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="4" fill="#282828"/>
        <path d="M20 2a2 2 0 1 0 0 4 2 2 0 1 0 0-4m-3 10 .5-5.5L12 7l1.75 1.75c-.47.4-1.01.5-1.69.63-1.05.19-2.35.44-3.4 1.93s-.83 2.8-.65 3.85c.15.9.26 1.55-.32 2.38-.58.82-1.23.94-2.12 1.11-1.05.19-2.35.43-3.4 1.93l1.64 1.15c.58-.82 1.22-.94 2.12-1.11 1.05-.19 2.35-.43 3.4-1.93 1.05-1.49.83-2.8.65-3.85-.15-.9-.26-1.55.32-2.38.58-.82 1.23-.94 2.12-1.11.84-.15 1.84-.35 2.74-1.18L16.99 12ZM3.71 8.71l1.79-1.8 1.79 1.8 1.42-1.42-1.8-1.79 1.8-1.79-1.42-1.42-1.79 1.8-1.79-1.8-1.42 1.42 1.8 1.79-1.8 1.79zm16.58 5.58L18 16.59l-2.29-2.3-1.42 1.42 2.3 2.29-2.3 2.29 1.42 1.42 2.29-2.3 2.29 2.3 1.42-1.42-2.3-2.29 2.3-2.29z" fill="#ebdbb2"/>
      </svg>
      <span class="brand">SpielOS</span>
      <span class="tag" id="tag"></span>
    </div>
    <div class="title" id="title"></div>
    <div class="desc" id="desc"></div>
  </div>
  <div class="bottom-bar">
    <span class="url">spielos.xyz</span>
    <span class="handle">@ShayanSpiel</span>
  </div>
</body>
</html>
