<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Outfit';
  src: url('file:///Users/shayan/ShayanSpiel.Github.io/src/assets/fonts/outfit-latin.woff2') format('woff2');
  font-weight: 100 900;
  font-display: swap;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  font-family: 'Outfit', sans-serif;
  background: #1d2021;
  color: #fbf1c7;
  overflow: hidden;
  position: relative;
}
.bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(251,241,199,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(251,241,199,0.03) 1px, transparent 1px);
  background-size: 32px 32px;
}
.bg-glow {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  top: -200px;
  right: -100px;
}
.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
  padding: 64px 80px;
}
.top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 32px;
}
.logo-icon {
  width: 36px;
  height: 36px;
}
.brand {
  font-size: 16px;
  font-weight: 600;
  color: #a89984;
  letter-spacing: 0.5px;
}
.tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
  margin-left: 8px;
}
.title {
  font-size: 56px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1.5px;
  max-width: 900px;
  margin-bottom: 24px;
}
.desc {
  font-size: 20px;
  font-weight: 400;
  color: #a89984;
  max-width: 700px;
  line-height: 1.5;
}
.bottom-bar {
  position: absolute;
  bottom: 48px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.url {
  font-size: 15px;
  font-weight: 500;
  color: #665c54;
}
.handle {
  font-size: 15px;
  font-weight: 500;
  color: #665c54;
}
.accent-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
}
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow" id="glow"></div>
  <div class="accent-bar" id="accentBar"></div>
  <div class="container">
    <div class="top-bar">
      <svg class="logo-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#282828"/>
        <path d="M16 7l-12 12 6 6 3-3 3 3 3-3 3 3 6-6-12-12zM16 19l-3-3 3-3 3 3-3 3z" fill="#ebdbb2"/>
      </svg>
      <span class="brand">SpielOS</span>
      <span class="tag" id="tag"></span>
    </div>
    <div class="title" id="title"></div>
    <div class="desc" id="desc"></div>
  </div>
  <div class="bottom-bar">
    <span class="url">spielos.xyz</span>
    <span class="handle">@ShayanSpiel</span>
  </div>
</body>
</html>
